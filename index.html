<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>小饼干烘焙中心</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: #f9f9f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Comic Neue', 'Chalkboard SE', cursive;
            margin: 0;
            padding: 20px;
        }

        /* 游戏主面板  */
        .game-board {
            position: relative;
            width: 800px;
            height: 800px;
            background-image: url('底图.png');
            background-size: cover;
            background-position: center;
        }

       /* 烤盘区域 */
.tray-area {
    position: absolute;
  top: 100px;
left: 50px;
width: 700px;
height: 580px;
    background-image: url('烤盘.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    pointer-events: auto;
    cursor: crosshair;
}
        /* 饼干样式  */
        .cookie {
            position: absolute;
            width: 180px;
            height: 180px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            z-index: 10;
            image-rendering: crisp-edges;
        }
        .cookie:hover {
            transform: scale(1.05);
        }
        .cookie.selected {
            transform: scale(1.1) translateY(-8px);
            z-index: 100;
        }

        /* 确认摆盘按钮 */
        .confirm-btn {
            position: absolute;
            bottom: 50px;
            right: 50px;
            background: #ffc947;
            color: #4a2c1a;
            padding: 16px 36px;
            border: 3px solid #d4891a;
            border-radius: 8px;
            font-size: 26px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            z-index: 20;
            letter-spacing: 2px;
        }
        .confirm-btn:hover {
            background: #ffd267;
        }
        .confirm-btn:active {
            background: #e6b030;
        }

        /* 火力条外框  */
        .fire-bar-container {
            position: absolute;
            bottom: 80px;
            left: 70px;
            width: 70px;
            height: 280px;
            background: #5a3620;
            border-radius: 8px;
            border: 3px solid #5a3620;
            overflow: hidden;
            visibility: hidden;
        }
        .fire-bar {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .zone-red {
            position: absolute;
            top: 0;
            width: 100%;
            height: 33.33%;
            background: #d43030;
        }
        .zone-green {
            position: absolute;
            top: 33.33%;
            width: 100%;
            height: 33.33%;
            background: #5cb85c;
        }
        .zone-white {
            position: absolute;
            top: 66.66%;
            width: 100%;
            height: 33.33%;
            background: #f5e6a0;
        }
        /* 移动的指针 */
        .fire-needle {
            position: absolute;
            left: 0;
            width: 100%;
            height: 12px;
            background: #5a3620;
            border-radius: 4px;
            top: 0%;
            z-index: 5;
            transition: top 0.02s linear;
        }

        /* loading 浮层 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(40,20,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
            visibility: hidden;
        }
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #f3e5ab;
            border-top: 8px solid #ff8000;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #ffdd99;
            font-size: 28px;
            margin-top: 24px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        /* 结果对话框 + 人物区 */
        .dialogue-area {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: fit-content;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 25;
            visibility: hidden;  
        }
        .character {
            width: 80px;
            height: 80px;
            background: #f0d8a0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            flex-shrink: 0;
        }
        .speech-bubble {
            flex: 1;
            background: #fffef0;
            border-radius: 8px;
            padding: 18px 24px;
            font-size: 20px;
            font-weight: bold;
            color: #563e1f;
            position: relative;
            font-family: inherit;
            line-height: 1.5;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 28px;
            width: 0;
            height: 0;
            border: 8px solid transparent;
            border-right-color: #fffef0;
        }

        /* 重置按钮 */
        .reset-btn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: #b87850;
            border: 2px solid #8b5e3c;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            z-index: 25;
            letter-spacing: 1px;
        }
        .reset-btn:hover {
            background: #c88860;
        }
        .reset-btn:active {
            background: #a06840;
        }
    </style>
</head>










<body>
<div class="game-board" id="gameBoard">

    <div class="tray-area" id="trayArea"></div>


    <button class="confirm-btn" id="confirmBtn">确认摆盘</button>

  
    <div class="fire-bar-container" id="fireBarContainer">
        <div class="fire-bar">
            <div class="zone-red"></div>
            <div class="zone-green"></div>
            <div class="zone-white"></div>
            <div class="fire-needle" id="needle"></div>
        </div>
    </div>


    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">🔥 烤箱工作中 🔥</div>
    </div>


    <div class="dialogue-area" id="dialogueArea">
        <div class="character" id="character">🐻‍❄️</div>
        <div class="speech-bubble" id="speechBubble">...</div>
    </div>

    <button class="reset-btn" id="resetBtn">再烤一盘？</button>
</div>




<script>
    
    // 初始4个饼干坐标
    let cookies = [
        { id: 0, state: 'raw', x: 150, y: 100, imgSrc: '右下1.png' },
        { id: 1, state: 'raw', x: 380, y: 100, imgSrc: '左下1.png' },
        { id: 2, state: 'raw', x: 150, y: 300, imgSrc: '左上1.png' },
        { id: 3, state: 'raw', x: 390, y: 280, imgSrc: '右上1.png' }
    ];

    let gamePhase = 'arranging';   // 'arranging' , 'baking' , 'result'
    let fireMoving = false;
    let currentFirePos = 20;       // 0~100
    let needleDirection = 1;        // 1下 -1上
    let animationId = null;
    let selectedCookieId = null;

    // DOM 元素
    const trayArea = document.getElementById('trayArea');
    const confirmBtn = document.getElementById('confirmBtn');
    const fireBarContainer = document.getElementById('fireBarContainer');
    const needle = document.getElementById('needle');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const dialogueArea = document.getElementById('dialogueArea');
    const speechBubble = document.getElementById('speechBubble');
    const characterDiv = document.getElementById('character');
    const resetBtn = document.getElementById('resetBtn');
    const gameBoard = document.getElementById('gameBoard');

    // 拖拽状态
    let draggingId = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    // 辅助：重新渲染所有饼干（带拖拽）
    function renderCookies() {
        const existingCookies = document.querySelectorAll('.cookie');
        existingCookies.forEach(c => c.remove());

        cookies.forEach(cookie => {
            const cookieDiv = document.createElement('div');
            cookieDiv.className = 'cookie';
            cookieDiv.innerHTML = '<img src="' + cookie.imgSrc + '" style="width:100%;height:100%;object-fit:cover;">';
            cookieDiv.style.left = cookie.x + 'px';
            cookieDiv.style.top = cookie.y + 'px';
            cookieDiv.setAttribute('data-id', cookie.id);

            // 鼠标按下 / 触摸开始：开始拖拽
            cookieDiv.addEventListener('mousedown', (e) => {
                if (gamePhase !== 'arranging') return;
                e.preventDefault();
                e.stopPropagation();
                draggingId = cookie.id;
                const trayRect = trayArea.getBoundingClientRect();
                dragOffsetX = e.clientX - trayRect.left - cookie.x;
                dragOffsetY = e.clientY - trayRect.top - cookie.y;
                cookieDiv.classList.add('selected');
            });
            cookieDiv.addEventListener('touchstart', (e) => {
                if (gamePhase !== 'arranging') return;
                e.stopPropagation();
                draggingId = cookie.id;
                const touch = e.touches[0];
                const trayRect = trayArea.getBoundingClientRect();
                dragOffsetX = touch.clientX - trayRect.left - cookie.x;
                dragOffsetY = touch.clientY - trayRect.top - cookie.y;
                cookieDiv.classList.add('selected');
            }, { passive: true });

            trayArea.appendChild(cookieDiv);
        });
    }

    // 鼠标移动 / 触摸移动：拖拽中
    function onDragMove(clientX, clientY) {
        if (draggingId === null) return;
        const trayRect = trayArea.getBoundingClientRect();
        let newX = clientX - trayRect.left - dragOffsetX;
        let newY = clientY - trayRect.top - dragOffsetY;
        newX = Math.min(Math.max(newX, 0), trayArea.clientWidth - 120);
        newY = Math.min(Math.max(newY, 0), trayArea.clientHeight - 120);

        const cookie = cookies.find(c => c.id === draggingId);
        if (cookie) {
            cookie.x = newX;
            cookie.y = newY;
        }
        // 直接移动 DOM，避免整页重渲染
        const el = trayArea.querySelector('[data-id="' + draggingId + '"]');
        if (el) {
            el.style.left = newX + 'px';
            el.style.top = newY + 'px';
        }
    }

    document.addEventListener('mousemove', (e) => onDragMove(e.clientX, e.clientY));
    document.addEventListener('touchmove', (e) => {
        if (draggingId !== null) {
            onDragMove(e.touches[0].clientX, e.touches[0].clientY);
        }
    }, { passive: true });

    // 鼠标松开 / 触摸结束：结束拖拽
    function onDragEnd() {
        if (draggingId !== null) {
            const el = trayArea.querySelector('[data-id="' + draggingId + '"]');
            if (el) el.classList.remove('selected');
            draggingId = null;
        }
    }
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchend', onDragEnd);










    // 火力条移动
    function startFireMoving() {
        if (animationId) cancelAnimationFrame(animationId);
        let pos = 20; // 初始中间区域
        needleDirection = 1;
        function step() {
            if (gamePhase !== 'baking' || fireBarContainer.style.visibility === 'hidden') return;
            pos += needleDirection * 0.9;
            if (pos >= 100) { pos = 100; needleDirection = -1; }
            if (pos <= 0) { pos = 0; needleDirection = 1; }
            currentFirePos = pos;
            needle.style.top = pos + '%';
            animationId = requestAnimationFrame(step);
        }
        animationId = requestAnimationFrame(step);
    }

    // 停止指针移动并判定火力结果
    function stopAndJudge() {
        if (gamePhase !== 'baking') return;
        // 取消移动动画
        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        // 显示loading
        loadingOverlay.style.visibility = 'visible';

        setTimeout(() => {
            // 根据火力值判定结果 (红:0-33 绿:33-66 白66-100)
            let result = '';
            let resultText = '';
            if (currentFirePos >= 0 && currentFirePos < 33) {
                result = 'burnt';
                resultText = '怎么苦苦的。';
            } else if (currentFirePos >= 33 && currentFirePos <= 66) {
                result = 'perfect';
                resultText = '好吃。';
            } else {
                result = 'undercooked';
                resultText = '好像还没熟......';
            }
            // 改变所有饼干状态(换图片)
            // 每个饼干对应: X1=没熟, X2=完美, X3=烤糊
            const posPrefix = ['右下', '左下', '左上', '右上'];
            const suffixMap = { undercooked: '1', perfect: '2', burnt: '3' };
            cookies.forEach(c => {
                c.state = result;
                c.imgSrc = posPrefix[c.id] + suffixMap[result] + '.png';
            });
            renderCookies();

            // 显示对话框和人物区
            dialogueArea.style.visibility = 'visible';
            speechBubble.innerText = resultText;
            // 人物头像：完美=完美.png，烤糊/没熟=不完美.png
            if (result === 'perfect') {
                characterDiv.innerHTML = '<img src="完美.png" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
            } else {
                characterDiv.innerHTML = '<img src="不完美.png" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
            }

            loadingOverlay.style.visibility = 'hidden';
            gamePhase = 'result';
        }, 800);
    }

    // 重置游戏
    function resetGame() {
        // 重置饼干数据
        cookies = [
            { id: 0, state: 'raw', x: 100, y: 80, imgSrc: '右下1.png' },
            { id: 1, state: 'raw', x: 400, y: 100, imgSrc: '左下1.png' },
            { id: 2, state: 'raw', x: 150, y: 300, imgSrc: '左上1.png' },
            { id: 3, state: 'raw', x: 420, y: 320, imgSrc: '右上1.png' }
        ];
        selectedCookieId = null;
        gamePhase = 'arranging';
        if (animationId) cancelAnimationFrame(animationId);
        // 重置人物头像
        characterDiv.innerHTML = '🐻‍❄️';
        // 隐藏火力条、对话框、loading
        fireBarContainer.style.visibility = 'hidden';
        dialogueArea.style.visibility = 'hidden';
        loadingOverlay.style.visibility = 'hidden';
        confirmBtn.style.visibility = 'visible';
        confirmBtn.disabled = false;
        renderCookies();
    }

    // 确认摆盘 => 切换烘焙阶段
    function onConfirmArrange() {
        if (gamePhase !== 'arranging') return;
        gamePhase = 'baking';
        confirmBtn.style.visibility = 'hidden';   // 确认键消失
        fireBarContainer.style.visibility = 'visible';
        // 重置火力指针位置
        currentFirePos = 35;
        needle.style.top = '35%';
        startFireMoving();  // 指针开始上下移动

        // 监听点击屏幕任意位置 (但避免点到按钮冲突)
        const bakeHandler = (e) => {
            if (gamePhase === 'baking') {
                stopAndJudge();
                document.removeEventListener('click', bakeHandler);
            }
        };
        // 延迟一点点加监听，防止当前按钮冒泡直接触发
        setTimeout(() => {
            document.addEventListener('click', bakeHandler);
        }, 50);
    }

    // 事件绑定
    confirmBtn.addEventListener('click', onConfirmArrange);
    resetBtn.addEventListener('click', resetGame);

    // 初始化渲染
    renderCookies();
    // 其他预备: 保证托盘区域相对定位
    trayArea.style.position = 'relative';
    trayArea.style.pointerEvents = 'auto';
</script>
</body>
</html>
